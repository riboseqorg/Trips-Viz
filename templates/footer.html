<footer>
  <script
    src="https://cdn.jsdelivr.net/npm/cookieconsent@3/build/cookieconsent.min.js"
    data-cfasync="false"
  ></script>
  <script type="text/javascript">
    var gtagId = "UA-115765268-1";
    //window['ga-disable-' + gtagId] = true;

    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag("js", new Date());

    window.addEventListener("load", function () {
      window.cookieconsent.initialise({
        type: "opt-out",
        theme: "classic",
        palette: {
          popup: {
            background: "#eaf7f7",
            text: "#5c7291",
          },
          button: {
            background: "#56cbdb",
            text: "#ffffff",
          },
        },
        theme: "classic",
        position: "top",

        content: {
          message:
            "This website uses cookies to generate website usage statistics via google analytics and persistent cookies to save user preferences and facilitate data uploads.",
        },
      });
    });
  </script>
  <script>
    // All these should be at bottom

    $(document).ready(() => {
      $("#{{request.endpoint}}").addClass("active");
      const plotname = window.location.pathname.split("/");
      //$("#plots").select2("destroy");

      $("#plots")
        .val(plotname[plotname.length - 2])
        .trigger("change.select2");
    });

    $("#plots").change(() => {
      const organism = $('input[name = "organism"]').val();
      const assembly = $('input[name = "transcriptome"]').val();
      const plot = $("#plots").val();

      const url = "/" + organism + "/" + assembly + "/" + plot;
      window.location.href = url;
    });
  </script>
</footer>
