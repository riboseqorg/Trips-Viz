{% extends "layout.html" %}
{% block content %}
    <div class="page-section">
        <div id="page_heading">
            <p>
                <font size="5"><b><u>General Settings</u></b></font>
            </p>
        </div>
    </div>
    <div class="page-section">
        <div class="row">
            <div class="col-4">
                <input id="ambig_check"
                       type="checkbox"
                       name="ambig"
                       {% if ambig=="T" %} checked {% else %}  {% endif %} />
            </div>
            <div class="col-8">
                <label for='ambig_check' class='padded_label'>Allow ambiguously mapped reads</label>
                <a class="whatsthis"
                   target="_blank"
                   href="/help/?parent_acc=parent_single_gene&child_acc=child_ambig">&#9432;</a>
            </div>
        </div>
        <div class="row">
            <div class="col-4">
                <input id="normalize"
                       type="checkbox"
                       name="normalize"
                       {% if normalize=="T" %} checked {% else %}  {% endif %} />
            </div>
            <div class="col-8">
                <label for='normalize' class='padded_label'>Normalize by mapped reads</label>
                <a class="whatsthis"
                   target="_blank"
                   href="/help/?parent_acc=parent_comparison&child_acc=child_comp_norm">&#9432;</a>
            </div>
        </div>
        <div class="row">
            <div class="col-4">
                <input id="comp_ribocov"
                       type="checkbox"
                       name="comp_ribocov"
                       {% if comp_ribocov=="T" %} checked {% else %}  {% endif %} />
            </div>
            <div class="col-8">
                <label for='normalize' class='padded_label'>Ribo-Seq coverage</label>
                <a class="whatsthis"
                   target="_blank"
                   href="/help/?parent_acc=parent_comparison&child_acc=child_comp_norm">&#9432;</a>
            </div>
        </div>
        <div class="row">
            <div class="col-4">
                <b>Gene/Transcript: </b><a class="whatsthis"
   target="_blank"
   href="/help/?parent_acc=parent_comparison&child_acc=child_comp_gene">&#9432;</a>
            </div>
            <div class="col-8">
                <input align="center"
                       id="tran"
                       type="text"
                       name="transcript"
                       value="ENST00000367055" />
            </div>
        </div>
        <div class="row">
            <div class="col-4">
                <b>Min Read: </b><a class="whatsthis"
   target="_blank"
   href="/help/?parent_acc=parent_comparison&child_acc=child_comp_minread">&#9432;</a>
            </div>
            <div class="col-8">
                <input type="text" id="minread" name="minread" value="25" />
            </div>
        </div>
        <div class="row">
            <div class="col-4">
                <b>Max Read: </b><a class="whatsthis"
   target="_blank"
   href="/help/?parent_acc=parent_comparison&child_acc=child_comp_maxread">&#9432;</a>
            </div>
            <div class="col-8">
                <input type="text" id="maxread" name="maxread" value="150" />
            </div>
        </div>
        <div class="row">
            <div class="col-4">
                <b>Highlight start: </b><a class="whatsthis"
   target="_blank"
   href="/help/?parent_acc=parent_comparison&child_acc=child_comp_hili">&#9432;</a>
            </div>
            <div class="col-8">
                <input type="text" id="hili_start" name="hili_start" value="0" />
            </div>
        </div>
        <div class="row">
            <div class="col-4">
                <b>Highlight stop: </b><a class="whatsthis"
   target="_blank"
   href="/help/?parent_acc=parent_comparison&child_acc=child_comp_hili">&#9432;</a>
            </div>
            <div class="col-8">
                <input type="text" id="hili_stop" name="hili_stop" value="0" />
            </div>
        </div>
    </div>
    <div class="page-section">
        <div id="page_heading">
            <p>
                <font size="5"><b><u>Seq Types</u></b></font>
            </p>
        </div>
    </div>
    <div class="page-section">
        <div id="page_heading">
            <p>
                <font size="5"><b><u>Studies</u></b></font>
            </p>
        </div>
    </div>
    <div class="page-section">
        <div id="page_heading">
            <p>
                <font size="5"><b><u>Files</u></b></font>
            </p>
        </div>
    </div>
    <div id = "dialog-2" title = "Choose a transcript..."></div>
    <div id="files">
    </br>
    <p>
        <font size="5" align="center"><b><u>Files</u></b>
        </br>
    </font>
</p>
</div>
<div id="file_list">
    <div id="group_1_div" class="group_div">
        <input class="colorbox" id="group1_color" name="favcolor" value="#ff0000" />
        <input style="font-weight: bold;
                      max-width: 40%;
                      align:center"
               name="group_1_label"
               id="group1_label"
               type="text"
               value="Group 1" />
        <ul class="draggable_filelist"
            id="group_1_file_list"
            style="align:center">
        </ul>
    </div>
</div>
<div id="view_plot">
    <button class="button centerbutton" type="button" id="comparequery">
        <b>View Plot</b>
    </button>
</div>
{% include "loading.html" %}
<div id = "study_dialog" title = "Study info"></div>
<script type="text/javascript"
        src="{{ url_for('static', filename='js/common.js') }}"></script>
{% endblock %}
