<div id="sidebar">
    <br />
    <p>
        <font size="5" align="center"><b><u>Choose plot type</u></b></font>
    </p>
    <br />
    <br />
    <table align="center" class="plot_table" id="plottype_table">
        <tr>
            <td>
                <input class="study_radio readlen_dist"
                       type="radio"
                       value="readlen_dist"
                       name="plottype"
                       checked>
                <label for="readlen" class='subplot_label'>Read Length Distribution</label>
                <a class='whatsthis'
                   target='_blank'
                   href='/help/?parent_acc=parent_metainfo&child_acc=child_readlen_dist'>  <i class="bi bi-info-circle"></i> </a>
            </td>
        </tr>
        <tr>
            <td>
                <input class="study_radio nuc_comp"
                       type="radio"
                       value="nuc_comp"
                       name="plottype"
                       unchecked>

                   target='_blank'
                   href='/help/?parent_acc=parent_metainfo&child_acc=child_nuc_comp'>  <i class="bi bi-info-circle"></i> </a>
            </td>
        </tr>
        <tr>
            <td>
                <input class="study_radio trip_periodicity"
                       type="radio"
                       value="trip_periodicity"
                       name="plottype"
                       unchecked>

        </tr>
        <tr>
            <td>
                <input class="study_radio heatmap"

            </td>
        </tr>
    </table>
