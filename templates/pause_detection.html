{% extends "layout.html" %}
{% block content %}
    <div class="page-section">
        <div class="row">
            <div class="row">
                <div class="col-6">
                    <b>Minimum fold change:</b>
                </div>
                <div class="col-6">
                    <input id="min_fold_change" type="number" name="min_fold_change" value="20" />
                    <span class='tooltip'
                          style="max-height:800px"
                          title="The fold change for a pause is also referred to as the pause score(Si). Pauses are predicted using the following procedure. The number of reads r mapped to each position i within a sliding window of length n (step = n/2) is normalized over the average density within the window to score the pause. The average of these values across overlapping windows is used as the pause score, Si: ">&#9432;</span>
                </div>
            </div>
            <div class="row">
                <div class="col-6">
                    <b>Window size:</b>
                </div>
                <div class="col-6">
                    <input id="window_size" type="number" name="window_size" value="500" />
                    <span class='tooltip'
                          title="The default size of the window(n) for calculating the background density is 1000 nucleotides (nt). An overlapping window approach is used in the pause prediction such that each window overlaps the previous window by 50% (i.e. the step size is n/2). For pauses which are predicted in both overlapping windows, the pause score and window coverage are averaged for the final output. ">&#9432;</span>
                </div>
            </div>
            <div class="row">
                <div class="col-6">
                    <b>Minimum coverage (%):</b>
                </div>
                <div class="col-6">
                    <input id="min_coverage" type="number" name="min_coverage" value="5" />
                    <span class='tooltip'
                          title="The coverage(%) represents the percentage of positions within a window size that have a minimum of one read mapped. This parameter helps to filter out the genes/genomic regions that have a low density coverage across the window ">&#9432;</span>
                </div>
            </div>
            <div class="row">
                <div class="col-6">
                    <b>Nucleotide output:</b>
                </div>
                <div class="col-6">
                    <input id="nuc_output" type="number" name="nuc_output" value="15" />
                    <span class='tooltip'
                          title="The flanking nucleotide sequences of a predicted pause location are provided in the output. You can specify the length(nt) of up and downstream sequences to be provided in the output file (the default value is 50 nt). The sequence information can be used as input to secondary structure prediction tools which may provide insight into the pause occurrence. ">&#9432;</span>
                </div>
            </div>
            <div class="row">
                <div class="col-6">
                    <b>Minimum read length:</b>
                </div>
                <div class="col-6">
                    <input id="min_read_length" type="number" name="min_read_length" value="20" />
                    <span class='tooltip'
                          title="You can specify the footprint read lengths to be considered for the pause prediction(s). The default read length range is 25-35 nt. ">&#9432;</span>
                </div>
            </div>
            <div class="row">
                <div class="col-6">
                    <b>Maximum read score:</b>
                </div>
                <div class="col-6">
                    <input id="max_read_score" type="number" name="max_read_score" value="35" />
                    <span class='tooltip'
                          title="You can specify the footprint read lengths to be considered for the pause prediction(s). The default read length range is 25-35 nt. ">&#9432;</span>
                </div>
            </div>
            <div class="row">
                <div class="col-6">
                    <b>Transcripts:</b>
                </div>
                <div class="col-6">
                    <input id="prin_trans" type="radio" name="tranlist" checked>
                    Principal
                    <input id="all_trans" type="radio" name="tranlist" unchecked>
                    All
                    <input id="custom_trans" type="radio" name="tranlist" unchecked>
                    Custom:
                    <input id="custom_trans_list" type="text" name="custom_trans_list" />
                    <span class='tooltip'
                          title="Search for pauses only on principal transcripts, all transcripts or a custom list (enter a comma seperated list in the input box). ">&#9432;</span>
                </div>
            </div>
        </div>
    </div>
    <div class="page-section">
        <font size="5" align="center"><b><u>Seq types</u></b></font>
        <div class="row">
            <div class="col-6">
                <button class="button all_checks"
                        type="button"
                        onclick="uncheck_study_multi()">
                    <b>Uncheck All files in Files box</b>
                </button>
            </div>
            <div class="col-6">
                <button class="button all_checks" type="button" onclick="check_study_multi()">
                    <b>Check All files in Files box</b>
                </button>
            </div>
        </div>
    </div>
    <div class="page-section">
        <font size="5" align="center"><b><u>Seq types</u></b></font>
        <div class="row">
            <div class="col-6">
                <button class="button all_checks"
                        type="button"
                        onclick="uncheck_study_multi()">
                    <b>Uncheck All files in Files box</b>
                </button>
            </div>
            <div class="col-6">
                <button class="button all_checks" type="button" onclick="check_study_multi()">
                    <b>Check All files in Files box</b>
                </button>
            </div>
        </div>
    </div>
    <div class="page-section">
        <font size="5" align="center"><b><u>Seq types</u></b></font>
        <div class="row">
            <div class="col-6">
                <button class="button all_checks"
                        type="button"
                        onclick="uncheck_study_multi()">
                    <b>Uncheck All files in Files box</b>
                </button>
            </div>
            <div class="col-6">
                <button class="button all_checks" type="button" onclick="check_study_multi()">
                    <b>Check All files in Files box</b>
                </button>
            </div>
        </div>
    </div>
    <div id="options" align="center" style="padding:10px;">
        <p>
            <font size="5" align="center"><b><u>Options</u></b></font>
        </p>
    </div>
    <div id="buttons"></div>
    <div id="wrapper">
        <button class="button" type="button"  id="query">
            <b>Generate table</b>
        </button>
    </div>
    {% inlude 'loading.html' %}
    <script type="text/javascript"
            src="{{ url_for('static', filename='js/common.js') }}"></script>
{% endblock %}
